[Unit]
Requires=piagent-enrollment-wifi.socket
After=piagent-enrollment-wifi.socket

[Service]
WorkingDirectory=/opt/pocketnet/current
ExecStart=
ExecStart=/opt/pocketnet/python/bin/python3.12 -m raspberry.time_sync.ble_server --enrollment-state /var/lib/piagent-devices
ReadWritePaths=/var/lib/piagent-devices
UMask=0027
