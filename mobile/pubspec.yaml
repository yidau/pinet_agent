name: piagent
description: Mobile agent for Raspberry Pi system management and development.
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_reactive_ble: 5.5.0
  http: ^1.6.0
  material_ui: ^1.11.1
  mobile_scanner: 7.5.0
  path: ^1.9.1
  # Keep the BLE implementation compatible with the app's legacy Kotlin mode.
  reactive_ble_mobile: 5.5.0
  sqflite: ^2.4.6
  sqflite_common_ffi: '>=2.3.6 <2.4.0'
  sqlite3: ^2.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
