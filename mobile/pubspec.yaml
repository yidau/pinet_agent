publish_to: 'none'
version: 1.1.0+14

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  crypto: ^3.0.7
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_reactive_ble: 5.5.0
  grpc: ^5.2.0
  material_symbols_icons: ^4.2960.0
  material_ui: ^1.11.1
  mobile_scanner: 7.5.0
  path: ^1.9.1
  protobuf: ^6.1.0
  reactive_ble_mobile: 5.5.0
  sqflite: ^2.4.6
  sqflite_common_ffi: '>=2.3.6 <2.4.0'
  sqlite3: ^2.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
